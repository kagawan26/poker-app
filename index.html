<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#0b1724"><title>POKER HOUSE — Texas Hold'em</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#f6f5eb;background:#08151f}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#17354a,#08151f 70%)}main{max-width:860px;margin:auto;padding:22px 14px 50px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{font-size:24px;font-weight:900;letter-spacing:2px}.brand b{color:#f5c969}.tag{color:#a6b5c0;font-size:12px}.bank{border:1px solid #436073;background:#172b3b;border-radius:13px;padding:9px 14px;text-align:right;font-weight:700}.bank small{display:block;color:#a9bbc5;font-size:11px;font-weight:400}.table{margin-top:24px;min-height:470px;border:9px solid #593e29;border-radius:48% / 34%;box-shadow:0 18px 0 #2b211b,0 25px 32px #0009,inset 0 0 0 4px #b88a55;background:radial-gradient(ellipse,#1b795d 0%,#13684e 63%,#0a423c 100%);padding:35px 12px 20px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:18px}.seat{text-align:center}.who{font-size:13px;font-weight:800}.stack{font-size:12px;color:#d7eedf}.cards{display:flex;gap:5px;justify-content:center;margin:8px 0}.card{width:55px;height:78px;border-radius:8px;background:#fffdf5;color:#151c27;display:flex;flex-direction:column;align-items:center;justify-content:center;border:2px solid #e6ebec;box-shadow:0 4px 6px #0005;font-weight:900;font-size:21px;line-height:1.1}.card.red{color:#d9364f}.card.back{color:#eccc7f;background:repeating-linear-gradient(45deg,#16375f,#16375f 6px,#24517d 6px,#24517d 10px);border:3px solid #fff8df}.middle{text-align:center}.community{min-height:88px}.pot{background:#062a2699;display:inline-block;padding:8px 18px;border-radius:25px;border:1px solid #ffffff36;font-weight:800}.street{font-size:12px;letter-spacing:3px;color:#dbf7dd;margin:8px}.panel{background:#132b3b;border:1px solid #2a4557;border-radius:20px;margin-top:34px;padding:20px}.message{text-align:center;min-height:52px;font-weight:700;line-height:1.5}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:12px}button{border:0;border-radius:12px;padding:14px 5px;font-size:15px;font-weight:800;cursor:pointer;color:#0a2026;background:#e5edf0}button.primary{background:#f2c76c}button.danger{background:#dc5960;color:white}button:disabled{opacity:.4;cursor:not-allowed}.raise{display:flex;gap:10px;align-items:center;justify-content:center;margin-top:14px;font-size:13px}.raise input{width:160px;accent-color:#f2c76c}.log{color:#b8ced5;font-size:12px;text-align:center;min-height:19px}.instructions{color:#aabcc8;line-height:1.7;font-size:13px;margin-top:20px;text-align:center}@media(max-width:430px){.table{min-height:415px;border-width:6px;border-radius:38% / 23%;padding:25px 5px 15px}.card{width:43px;height:64px;font-size:17px}.brand{font-size:19px}.panel{padding:15px}.actions button{font-size:13px}.community{min-height:70px}}
</style></head><body><main><header class="top"><div><div class="brand">♠ POKER <b>HOUSE</b></div><div class="tag">TEXAS HOLD'EM · 1 vs CPU</div></div><div class="bank"><small>あなたのチップ</small><span id="balance">1,000</span> ●</div></header>
<section class="table" aria-label="ポーカーテーブル"><div class="seat"><div class="who">🤖 CPU</div><div class="stack" id="cpuStack"></div><div class="cards" id="cpuCards"></div></div><div class="middle"><div class="pot">POT <span id="pot">0</span> ●</div><div class="street" id="street">PRE-FLOP</div><div class="cards community" id="community"></div></div><div class="seat"><div class="cards" id="myCards"></div><div class="who">😎 YOU</div><div class="stack" id="myStack"></div></div></section>
<section class="panel"><div class="message" id="message" aria-live="polite">新しいゲームを始めましょう</div><div class="log" id="log"></div><div class="raise"><label for="raiseAmount">追加ベット <output id="raiseLabel">40</output> ●</label><input id="raiseAmount" type="range" min="20" max="200" value="40" step="10"></div><div class="actions"><button class="danger" id="fold">フォールド</button><button id="call">コール</button><button class="primary" id="raise">レイズ</button></div><div style="text-align:center;margin-top:14px"><button id="next" class="primary" style="width:100%">次のハンドを配る</button></div></section><p class="instructions">無料チップのみ・換金不可。練習用のCPU対戦です。<br>ブラインドは YOU 10 / CPU 20。レイズは現在のコール額に追加して支払います。</p></main>
<script>
'use strict';
const $=id=>document.getElementById(id), suits=['♠','♥','♦','♣'], ranks='23456789TJQKA';
let s={me:1000,cpu:1000,pot:0,stage:0,deck:[],board:[],hand:[],villain:[],toCall:0,active:false,finished:false,log:''};
const shuffle=()=>{let d=[];for(let r of ranks)for(let suit of suits)d.push({r,suit});for(let i=d.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[d[i],d[j]]=[d[j],d[i]]}return d};
const draw=()=>s.deck.pop();
const card=c=>'<div class="card '+('♥♦'.includes(c.suit)?'red':'')+'">'+(c.r==='T'?'10':c.r)+'<br>'+c.suit+'</div>';
const back=()=>'<div class="card back">♠</div>';
const format=n=>n.toLocaleString('ja-JP');
function render(){ $('balance').textContent=format(s.me);$('myStack').textContent=format(s.me)+' ●';$('cpuStack').textContent=format(s.cpu)+' ●';$('pot').textContent=format(s.pot);$('myCards').innerHTML=s.hand.map(card).join('');$('cpuCards').innerHTML=s.finished?s.villain.map(card).join(''):back()+back();$('community').innerHTML=s.board.map(card).join('');$('street').textContent=['PRE-FLOP','FLOP','TURN','RIVER','SHOWDOWN'][s.stage];$('log').textContent=s.log;$('next').hidden=s.active;['fold','call','raise','raiseAmount'].forEach(id=>$(id).disabled=!s.active);$('call').textContent=s.toCall?'コール '+s.toCall:'チェック';$('raise').disabled=!s.active||s.me<=s.toCall||s.cpu===0;$('raiseAmount').max=Math.max(20,Math.min(200,s.me-s.toCall,s.cpu));$('raiseAmount').min=20;$('raiseAmount').disabled=!s.active||Number($('raiseAmount').max)<20;$('raise').disabled=$('raiseAmount').disabled; $('raiseLabel').textContent=$('raiseAmount').value;}
function start(){if(s.me<20||s.cpu<20){s.me=1000;s.cpu=1000} s.deck=shuffle();s.board=[];s.hand=[draw(),draw()];s.villain=[draw(),draw()];s.pot=30;s.me-=10;s.cpu-=20;s.toCall=10;s.stage=0;s.active=true;s.finished=false;s.log='YOU: SB 10 · CPU: BB 20';$('message').textContent='あなたの番です';$('raiseAmount').value=40;render()}
function payPlayer(amount){let paid=Math.min(amount,s.me);s.me-=paid;s.pot+=paid;return paid}
function payCpu(amount){let paid=Math.min(amount,s.cpu);s.cpu-=paid;s.pot+=paid;return paid}
function moveStreet(){s.toCall=0;s.stage++;if(s.stage===1)s.board.push(draw(),draw(),draw());if(s.stage===2||s.stage===3)s.board.push(draw());if(s.stage>=4){showdown();return}if(s.me===0||s.cpu===0){moveStreet();return} s.log=['','フロップ公開','ターン公開','リバー公開'][s.stage];$('message').textContent='次のアクションを選んでください';render()}
function action(type){if(!s.active)return;if(type==='fold'){s.cpu+=s.pot;s.pot=0;end('フォールドしました。CPUの勝ち');return}
 if(type==='call'){payPlayer(s.toCall);s.log=s.toCall?'あなたがコール':'あなたがチェック';s.toCall=0;moveStreet();return}
 if(type==='raise'){const extra=Math.min(Number($('raiseAmount').value),s.me-s.toCall,s.cpu);if(extra<20)return;const total=s.toCall+extra;payPlayer(total);s.toCall=0;s.log='あなたが '+format(total)+' ● をベット';const strength=evaluate(s.villain.concat(s.board))[0];const willFold=(strength<=1&&Math.random()<.18&&s.stage>0);if(willFold){s.me+=s.pot;s.pot=0;end('CPUがフォールド。あなたの勝ち！');return}payCpu(extra);s.log+=' · CPUが '+format(extra)+' ● をコール';moveStreet()}}
function end(msg){s.active=false;s.finished=true;$('message').textContent=msg;render()}
function evaluate(cards){let best=null;for(let a=0;a<cards.length-4;a++)for(let b=a+1;b<cards.length-3;b++)for(let c=b+1;c<cards.length-2;c++)for(let d=c+1;d<cards.length-1;d++)for(let e=d+1;e<cards.length;e++){let val=five([cards[a],cards[b],cards[c],cards[d],cards[e]]);if(!best||compare(val,best)>0)best=val}return best||[0]}
function five(cards){let nums=cards.map(c=>ranks.indexOf(c.r)+2).sort((a,b)=>b-a),counts={};nums.forEach(n=>counts[n]=(counts[n]||0)+1);let grouped=Object.keys(counts).map(Number).sort((a,b)=>counts[b]-counts[a]||b-a),unique=[...new Set(nums)];if(unique.includes(14))unique.push(1);let straight=0;for(let i=0;i<=unique.length-5;i++)if(unique[i]-unique[i+4]===4){straight=unique[i];break}let flush=cards.every(c=>c.suit===cards[0].suit);if(flush&&straight)return[8,straight];if(counts[grouped[0]]===4)return[7,grouped[0],grouped[1]];if(counts[grouped[0]]===3&&counts[grouped[1]]===2)return[6,grouped[0],grouped[1]];if(flush)return[5,...nums];if(straight)return[4,straight];if(counts[grouped[0]]===3)return[3,grouped[0],...grouped.slice(1)];if(counts[grouped[0]]===2&&counts[grouped[1]]===2)return[2,Math.max(grouped[0],grouped[1]),Math.min(grouped[0],grouped[1]),grouped[2]];if(counts[grouped[0]]===2)return[1,grouped[0],...grouped.slice(1)];return[0,...nums]}
function compare(a,b){for(let i=0;i<Math.max(a.length,b.length);i++){if((a[i]||0)!==(b[i]||0))return(a[i]||0)-(b[i]||0)}return 0}
function showdown(){let a=evaluate(s.hand.concat(s.board)),b=evaluate(s.villain.concat(s.board)),v=compare(a,b),labels=['ハイカード','ワンペア','ツーペア','スリーカード','ストレート','フラッシュ','フルハウス','フォーカード','ストレートフラッシュ'];let pot=s.pot;s.pot=0;if(v>0)s.me+=pot;else if(v<0)s.cpu+=pot;else{s.me+=Math.floor(pot/2);s.cpu+=pot-Math.floor(pot/2)}s.log='YOU: '+labels[a[0]]+' / CPU: '+labels[b[0]];end(v>0?'🎉 あなたの勝ち！ +'+pot+' ●':v<0?'CPUの勝ち。 -'+pot+' ●':'引き分け！')}
$('call').onclick=()=>action('call');$('fold').onclick=()=>action('fold');$('raise').onclick=()=>action('raise');$('next').onclick=start;$('raiseAmount').oninput=()=>{$('raiseLabel').textContent=$('raiseAmount').value};start();
</script></body></html>
